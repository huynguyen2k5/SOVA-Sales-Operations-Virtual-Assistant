name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: ai_sales_ops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_sales_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_sales_ops_ci
      JWT_SECRET: ci-only-secret-that-is-never-used-outside-github-actions-000000000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy app

      - name: Run tests with coverage
        run: >-
          uv run --frozen pytest
          --cov=app
          --cov-fail-under=80
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
          -q

      - name: Upgrade PostgreSQL schema
        run: uv run --frozen alembic upgrade head

      - name: Detect missing migrations
        run: uv run --frozen alembic check

      - name: Verify migration rollback and replay
        run: |
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  api-contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --directory backend --frozen --extra dev

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Regenerate OpenAPI schema
        run: uv run --directory backend --frozen python -m scripts.export_openapi

      - name: Regenerate TypeScript API types
        run: pnpm --dir frontend generate:api

      - name: Verify generated contract is committed
        run: git diff --exit-code -- frontend/src/api/openapi.json frontend/src/api/generated.ts

  full-stack:
    name: Docker Compose smoke test
    needs: [backend, frontend, api-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the full stack
        run: docker compose up --build --detach

      - name: Apply migrations and seed synthetic data
        run: |
          docker compose exec -T api python -m alembic upgrade head
          docker compose exec -T api python -m scripts.seed_demo

      - name: Verify frontend, API, authentication, and RBAC
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8000/health >/dev/null
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://localhost:5173/ >/dev/null

          login_response="$(curl --fail --silent --show-error \
            -X POST http://localhost:5173/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"staff.demo@example.test","password":"DemoPass123!"}')"
          access_token="$(jq -er '.accessToken' <<<"$login_response")"
          role="$(curl --fail --silent --show-error \
            http://localhost:5173/api/v1/auth/me \
            -H "Authorization: Bearer $access_token" | jq -er '.role')"
          test "$role" = "staff"

          audit_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            'http://localhost:5173/api/v1/audit-logs?page=1&pageSize=10' \
            -H "Authorization: Bearer $access_token")"
          test "$audit_status" = "403"

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the full stack
        if: always()
        run: docker compose down --volumes --remove-orphans
